<!DOCTYPE html>

<html lang="ko"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>나의 재무 MBTI 분석 🐿️ | 특성화고 홍보부스</title>
<link rel="preconnect" href="https://fonts.googleapis.com/">
<link rel="preconnect" href="https://fonts.gstatic.com/" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700&family=Jua&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
  :root{
    --ink:#3A2E26; --ink-soft:#6E5B4D;
    --cream:#FFF6E9; --cream2:#FFE9D6;
    --gold:#F5A623; --gold-d:#E0901A;
    --acorn:#8B5E34;
    --card-shadow: 0 18px 40px -12px rgba(120,80,40,.35);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0;}
  body{
    font-family:'Noto Sans KR',sans-serif; color:var(--ink);
    background:linear-gradient(160deg,#FFF6E9 0%,#FFE9D6 55%,#FFDFC2 100%);
    min-height:100vh; min-height:100dvh;
    display:flex; align-items:center; justify-content:center;
    padding:18px; line-height:1.55;
  }
  .display{font-family:'Jua',sans-serif; font-weight:400; letter-spacing:.2px;}
  .stage{width:100%; max-width:430px; position:relative;}
  .screen{display:none; animation:fade .45s ease both;}
  .screen.active{display:block;}
  @keyframes fade{from{opacity:0; transform:translateY(14px);} to{opacity:1; transform:translateY(0);}}

  /* ---------- INTRO ---------- */
  .hero{
    background:#fff; border-radius:30px; padding:34px 26px 30px;
    box-shadow:var(--card-shadow); text-align:center; border:3px solid #fff;
  }
  .coin{
    font-size:74px; line-height:1; display:inline-block;
    animation:bob 2.4s ease-in-out infinite;
    filter:drop-shadow(0 8px 10px rgba(180,120,40,.35));
  }
  @keyframes bob{0%,100%{transform:translateY(0) rotate(-4deg);}50%{transform:translateY(-10px) rotate(4deg);}}
  .eyebrow{
    display:inline-block; background:var(--cream2); color:var(--acorn);
    font-weight:700; font-size:12.5px; padding:6px 14px; border-radius:99px;
    letter-spacing:.5px; margin-bottom:14px;
  }
  .hero h1{font-size:30px; margin:6px 0 4px; color:var(--ink);}
  .hero h1 .pt{color:var(--gold-d);}
  .hero p{color:var(--ink-soft); font-size:15px; margin:10px 4px 0;}
  .meta{
    display:flex; justify-content:center; gap:18px; margin:22px 0 4px;
    color:var(--acorn); font-weight:700; font-size:13px;
  }
  .meta span{background:var(--cream); padding:8px 14px; border-radius:14px;}
  .btn{
    display:block; width:100%; border:none; cursor:pointer;
    font-family:'Jua',sans-serif; font-size:21px; color:#fff;
    background:linear-gradient(180deg,var(--gold) 0%,var(--gold-d) 100%);
    padding:17px; border-radius:20px; margin-top:24px;
    box-shadow:0 10px 20px -6px rgba(224,144,26,.6); transition:transform .12s, box-shadow .12s;
  }
  .btn:active{transform:translateY(2px); box-shadow:0 6px 12px -6px rgba(224,144,26,.6);}
  .btn.ghost{
    background:#fff; color:var(--acorn); border:2.5px solid var(--cream2);
    box-shadow:none; font-size:17px; padding:13px;
  }
  .btn-row{display:flex; gap:10px; margin-top:14px;}
  .btn-row .btn{margin-top:0;}

  /* ---------- QUIZ ---------- */
  .bar-wrap{margin:2px 4px 16px;}
  .bar-top{display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;}
  .bar-top b{font-family:'Jua'; color:var(--acorn); font-size:15px;}
  .bar-top small{color:var(--ink-soft); font-weight:700; font-size:13px;}
  .bar{height:12px; background:#fff; border-radius:99px; overflow:hidden; box-shadow:inset 0 2px 4px rgba(150,100,50,.15);}
  .bar i{display:block; height:100%; width:0; border-radius:99px;
    background:linear-gradient(90deg,#FFB627,#F5A623); transition:width .35s ease;}
  .q-card{background:#fff; border-radius:26px; padding:26px 22px; box-shadow:var(--card-shadow); border:3px solid #fff;}
  .q-num{font-family:'Jua'; color:var(--gold-d); font-size:15px; margin-bottom:6px;}
  .q-text{font-family:'Jua'; font-size:21px; line-height:1.4; margin:0 0 20px; min-height:58px;}
  .opt{
    display:flex; align-items:center; gap:12px; width:100%; text-align:left;
    background:var(--cream); border:2.5px solid var(--cream); cursor:pointer;
    padding:15px 16px; border-radius:18px; margin-bottom:11px; font-size:15.5px;
    font-weight:500; color:var(--ink); transition:all .14s; font-family:'Noto Sans KR';
  }
  .opt:active{transform:scale(.98);}
  .opt:hover{border-color:var(--gold); background:#FFF3E0;}
  .opt .dot{
    flex:0 0 26px; height:26px; border-radius:50%; background:#fff;
    border:2.5px solid #E8D5BE; transition:all .14s;
  }
  .opt:hover .dot{border-color:var(--gold); background:var(--gold);}
  .back-link{display:block; text-align:center; margin:16px auto 0; background:none; border:none;
    color:var(--ink-soft); font-weight:700; font-size:13.5px; cursor:pointer; text-decoration:underline;}

  /* ---------- RESULT CARD ---------- */
  .reveal{text-align:center; margin-bottom:6px;}
  .reveal .small{font-family:'Jua'; color:var(--acorn); font-size:15px;}
  /* the card that gets exported */
  #cardCapture{padding:6px;}
  .tcard{
    position:relative; border-radius:28px; padding:30px 24px 26px; overflow:hidden;
    box-shadow:var(--card-shadow); border:4px solid rgba(255,255,255,.9); text-align:center;
  }
  .tcard::before{
    content:""; position:absolute; inset:0; opacity:.4;
    background:radial-gradient(circle at 20% 15%, rgba(255,255,255,.9), transparent 45%);
    pointer-events:none;
  }
  .tcard .stamp{
    position:absolute; top:16px; right:18px; font-family:'Jua'; font-size:11px;
    color:#fff; background:rgba(0,0,0,.16); padding:5px 11px; border-radius:99px; letter-spacing:.5px;
  }
  .tcard .face{font-size:88px; line-height:1; filter:drop-shadow(0 8px 10px rgba(0,0,0,.18)); margin-top:6px;}
  .tcard .tname{font-family:'Jua'; font-size:30px; color:#fff; margin:10px 0 2px; text-shadow:0 2px 6px rgba(0,0,0,.18);}
  .tcard .tsub{display:inline-block; background:rgba(255,255,255,.92); font-weight:700; font-size:13px;
    padding:5px 14px; border-radius:99px; margin-bottom:14px;}
  .tcard .slogan{font-family:'Jua'; color:#fff; font-size:17px; margin:0 0 16px; text-shadow:0 1px 4px rgba(0,0,0,.2);}
  .tcard .panel{background:rgba(255,255,255,.95); border-radius:18px; padding:16px 16px 14px; text-align:left;}
  .tcard .desc{font-size:14px; color:var(--ink); margin:0 0 14px;}
  .row{margin-bottom:12px;}
  .row:last-child{margin-bottom:0;}
  .row .label{font-family:'Jua'; font-size:13.5px; margin-bottom:4px; display:flex; align-items:center; gap:6px;}
  .row .val{font-size:13.5px; color:var(--ink-soft); line-height:1.5;}
  .badges{display:flex; flex-wrap:wrap; gap:6px;}
  .badges span{font-size:12px; font-weight:700; padding:4px 10px; border-radius:99px; color:#fff;}
  .matchline{margin:14px 4px 0; font-size:12.5px; color:var(--ink-soft);}
  .matchline b{color:var(--acorn);}

  /* save + qr */
  .save-box{margin-top:18px;}
  .qr-box{
    background:#fff; border-radius:22px; padding:18px; margin-top:14px; text-align:center;
    box-shadow:var(--card-shadow); border:3px solid #fff;
  }
  .qr-box h3{font-family:'Jua'; font-size:16px; margin:0 0 4px; color:var(--ink);}
  .qr-box p{font-size:12.5px; color:var(--ink-soft); margin:0 0 14px;}
  #qrcode{display:inline-block; padding:10px; background:#fff; border-radius:14px; border:2px solid var(--cream2);}
  #qrcode img, #qrcode canvas{display:block;}

  /* save modal (long-press fallback) */
  .modal{position:fixed; inset:0; background:rgba(40,28,18,.72); display:none;
    align-items:center; justify-content:center; padding:22px; z-index:50; overflow-y:auto;}
  .modal.show{display:flex; animation:fade .3s ease both;}
  .modal-inner{background:#fff; border-radius:24px; padding:22px; max-width:380px; width:100%; text-align:center; max-height:90vh; overflow-y:auto;}
  .modal-inner h3{font-family:'Jua'; font-size:19px; margin:0 0 10px;}
  .modal-inner p{font-size:13.5px; color:var(--ink-soft); margin:0 0 14px;}
  .modal-inner img{width:100%; border-radius:16px; box-shadow:var(--card-shadow); cursor:pointer; -webkit-user-select:none; user-select:none;}
  .modal-inner .hint{margin-top:12px; font-size:12.5px; color:var(--gold-d); font-weight:700;}
  .modal-close{margin-top:16px;}

  .loading{text-align:center; padding:30px; font-family:'Jua'; color:var(--acorn);}
  .foot{text-align:center; margin-top:18px; font-size:11.5px; color:var(--acorn); opacity:.75;}

  /* ========== 태블릿 최적화 (768px ~ 1199px) ========== */
  @media (min-width: 768px) {
    body {
      padding: 28px 36px;
      align-items: flex-start;
    }
    .stage {
      max-width: 900px;
      margin: 0 auto;
    }

    /* 인트로: 좌우 2단 */
    .hero {
      display: grid;
      grid-template-columns: 1fr 1fr;
      column-gap: 40px;
      padding: 48px 46px;
      text-align: left;
      align-items: center;
    }
    .hero .coin-wrap {
      grid-column: 2;
      grid-row: 1 / 6;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .hero .eyebrow { grid-column: 1; grid-row: 1; font-size: 15px; padding: 8px 18px; }
    .hero h1       { grid-column: 1; grid-row: 2; font-size: 44px; margin: 12px 0 10px; }
    .hero p        { grid-column: 1; grid-row: 3; font-size: 19px; margin: 0; }
    .hero .meta    { grid-column: 1; grid-row: 4; justify-content: flex-start; margin: 22px 0 4px; gap: 12px; }
    .hero .meta span { font-size: 15px; padding: 10px 16px; }
    .hero .btn-intro-wrap { grid-column: 1; grid-row: 5; display: flex; flex-direction: column; gap: 12px; margin-top: 4px; }
    .hero .btn-intro-wrap .btn { margin-top: 0; font-size: 24px; padding: 20px; }

    .coin { font-size: 130px; }

    /* 퀴즈 */
    .bar-wrap { margin: 4px 8px 24px; }
    .bar-top b { font-size: 19px; }
    .bar-top small { font-size: 16px; }
    .bar { height: 16px; }
    .q-card { padding: 40px 36px; border-radius: 32px; }
    .q-num { font-size: 19px; margin-bottom: 8px; }
    .q-text { font-size: 30px; min-height: 72px; margin-bottom: 28px; line-height: 1.4; }
    .opt {
      padding: 20px 24px;
      font-size: 19px;
      border-radius: 20px;
      margin-bottom: 14px;
      gap: 16px;
    }
    .opt .dot { flex: 0 0 32px; height: 32px; }
    .back-link { font-size: 17px; margin-top: 22px; }

    /* ── 결과 화면: 좌(카드) + 우(액션) 2단 ── */
    #result { display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: auto; column-gap: 28px; align-items: start; }
    #result .reveal   { grid-column: 1 / -1; margin-bottom: 10px; }
    #result .reveal .small { font-size: 18px; }
    #result #cardCapture { grid-column: 1; grid-row: 2; }
    #result .result-bottom { grid-column: 2; grid-row: 2 / 4; display: flex; flex-direction: column; gap: 16px; margin-top: 0; }
    #result .matchline { margin-top: 0; margin-bottom: 4px; font-size: 15px; order: -1; }
    #result .foot { grid-column: 1 / -1; }

    /* 결과 카드 내부 */
    .tcard { padding: 32px 26px 28px; border-radius: 28px; }
    .tcard .face { font-size: 90px; }
    .tcard .tname { font-size: 32px; }
    .tcard .tsub { font-size: 14px; padding: 6px 16px; margin-bottom: 10px; }
    .tcard .slogan { font-size: 18px; margin-bottom: 14px; }
    .tcard .panel { padding: 18px 18px 14px; border-radius: 18px; }
    .tcard .desc { font-size: 15px; margin-bottom: 14px; }
    .row .label { font-size: 15px; }
    .row .val { font-size: 15px; }
    .badges span { font-size: 13px; padding: 5px 12px; }

    /* 우측 액션 패널 */
    .result-bottom { margin-top: 0; }
    .save-box .btn { font-size: 20px; padding: 18px; }
    .save-box .btn.display { font-size: 22px; padding: 20px; }
    .btn-row { gap: 12px; margin-top: 12px; }
    .btn-row .btn { font-size: 17px; padding: 16px; }

    .qr-box { margin-top: 0; padding: 24px; }
    .qr-box h3 { font-size: 19px; }
    .qr-box p { font-size: 15px; margin-bottom: 18px; }
    #qrcode { padding: 12px; }

    /* 도감 그리드 */
    #typeGrid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }
    #typeGrid > div { margin-bottom: 0 !important; font-size: 17px; }

    /* 모달 */
    .modal-inner { max-width: 540px; padding: 36px; }
    .modal-inner h3 { font-size: 24px; }
    .modal-inner p { font-size: 16px; }

    .foot { font-size: 14px; margin-top: 28px; }
  }

  /* ========== 대형 태블릿 (1024px+) ========== */
  @media (min-width: 1024px) {
    .stage { max-width: 1000px; }
    .hero { padding: 56px 56px; column-gap: 56px; }
    .hero h1 { font-size: 50px; }
    .hero p { font-size: 21px; }
    .coin { font-size: 150px; }
    .q-text { font-size: 32px; }
    .opt { font-size: 20px; padding: 22px 26px; }
    .tcard .face { font-size: 100px; }
    .tcard .tname { font-size: 36px; }
    .tcard .slogan { font-size: 20px; }
    .tcard .desc { font-size: 16px; }
    .row .label, .row .val { font-size: 16px; }
    #result { column-gap: 36px; }
  }
</style>
</head>
<body>
<div class="stage">

  <!-- ===== INTRO ===== -->
  <section id="intro" class="screen active">
    <div class="hero">
      <div class="coin-wrap"><span class="coin">🐷</span></div>
      <span class="eyebrow">신일비즈니스고등학교</span>
      <h1 class="display">나의 <span class="pt">재무 MBTI</span><br>분석하기</h1>
      <p>20개의 질문으로 알아보는<br>나의 재무 MBTI! 나는 어떤 동물일까?</p>
      <div class="meta">
        <span>❓ 질문 20개</span>
        <span>🐾 유형 6가지</span>
        <span>⏱ 약 4분</span>
      </div>
      <div class="btn-intro-wrap">
        <button class="btn display" onclick="startQuiz()">테스트 시작하기 →</button>
        <button class="btn ghost" onclick="showAllTypes()">유형 미리보기 👀</button>
      </div>
    </div>
    <div class="foot">© 신일비즈니스고등학교</div>
  </section>

  <!-- ===== QUIZ ===== -->
  <section id="quiz" class="screen">
    <div class="bar-wrap">
      <div class="bar-top"><b id="barLabel">시작!</b><small id="barCount">0 / 20</small></div>
      <div class="bar"><i id="barFill"></i></div>
    </div>
    <div class="q-card">
      <div class="q-num display" id="qNum">Q1</div>
      <h2 class="q-text" id="qText">질문</h2>
      <div id="opts"></div>
    </div>
    <button class="back-link" id="backBtn" onclick="prevQuestion()" style="display:none">← 이전 질문</button>
  </section>

  <!-- ===== RESULT ===== -->
  <section id="result" class="screen">
    <div class="reveal"><span class="small display">나의 재무 MBTI는…</span></div>
    <div id="cardCapture">
      <div class="tcard" id="tcard"></div>
    </div>
    <div class="result-bottom">
      <p class="matchline" id="matchLine" style="margin-top:0"></p>
      <div class="save-box">
        <button class="btn display" onclick="saveCard()">📸 유형 카드 이미지로 저장</button>
        <div class="btn-row">
          <button class="btn ghost" onclick="restart()">🔄 다시하기</button>
          <button class="btn ghost" onclick="showAllTypes()">🐾 전체 유형</button>
        </div>
      </div>
      <div class="qr-box">
        <h3>📱 내 폰으로 카드 받기</h3>
        <p>아래 QR을 내 휴대폰으로 찍으면<br>이 카드를 바로 저장할 수 있어요!</p>
        <div id="qrcode"></div>
      </div>
    </div>
    <div class="foot">© 신일비즈니스고등학교</div>
  </section>

  <!-- ===== ALL TYPES ===== -->
  <section id="allTypes" class="screen">
    <div class="reveal" style="margin-bottom:14px"><span class="small display">재무 MBTI 6종 도감 🐾</span></div>
    <div id="typeGrid"></div>
    <button class="btn ghost" onclick="goIntro()" style="margin-top:14px">← 처음으로</button>
    <div class="foot">© 신일비즈니스고등학교</div>
  </section>

</div>

<!-- save modal -->
<div class="modal" id="saveModal">
  <div class="modal-inner">
    <h3 class="display">카드가 완성됐어요! 🎉</h3>
    <div id="saveGuide" style="font-size:13.5px; color:var(--ink-soft); margin:0 0 14px; background:var(--cream); border-radius:14px; padding:12px 14px; line-height:1.7;">
      <!-- JS로 기기별 안내 삽입 -->
    </div>
    <img id="savedImg" alt="나의 재무 유형 카드" style="touch-action:manipulation;">
    <a class="btn display" id="dlLink" download="my-finance-type.png" style="margin-top:14px; text-decoration:none; display:block;">⬇ 이미지 다운로드</a>
    <button class="btn ghost modal-close" onclick="closeModal()" style="margin-top:10px;">닫기</button>
  </div>
</div>

<script>
/* ============================================================
   재무 유형 데이터 (6유형)
   ============================================================ */
const TYPES = {
  A:{ name:"알뜰 다람쥐", sub:"저축형 🐿️", face:"🐿️",

      grad:"linear-gradient(160deg,#FFD29E 0%,#E8943B 100%)", badge:"#C8762A",
      slogan:"오늘의 절약이 내일의 도토리!",
      desc:"미래를 위해 차곡차곡 모으는 당신! 충동구매를 잘 참고 작은 돈도 소중히 여기는 진정한 저축왕이에요.",
      good:["자기 통제력 만렙","비상 상황에 강함","돈 모으는 속도 1등"],
      tip:"가끔은 나를 위한 작은 보상도 OK! 너무 아끼다 기회를 놓치지 않기.",
      money:"자동이체로 ‘선저축 후지출’ 습관 만들기",
      match:"욜로 베짱이", clash:"잘 맞는 친구" },
  B:{ name:"욜로 베짱이", sub:"소비형 🦗", face:"🦗",
      accent:"#FF6FA5", grad:"linear-gradient(160deg,#FFC2DC 0%,#FF6FA5 100%)", badge:"#E04D86",
      slogan:"인생은 한 번뿐, 지금을 즐겨!",
      desc:"현재의 행복을 가장 소중히 여기는 당신! 좋아하는 것에 아낌없이 쓰고 삶을 즐기는 분위기 메이커예요.",
      good:["높은 삶의 만족도","경험에 투자","어디서나 분위기 메이커"],
      tip:"‘미래의 나’를 위한 작은 저축통장 하나만! 비상금은 꼭 필요해요.",
      money:"용돈의 10%만 먼저 떼어 저축, 나머지는 마음껏!",
      match:"알뜰 다람쥐" },
  C:{ name:"투자 여우", sub:"투자형 🦊", face:"🦊",
      accent:"#E8682C", grad:"linear-gradient(160deg,#FFBE9C 0%,#E8682C 100%)", badge:"#C0521F",
      slogan:"돈이 돈을 벌게 하라!",

/* ============================================================
   상태 & 화면 전환
   ============================================================ */
let idx = 0;
let scores = {A:0,B:0,C:0,D:0,E:0,F:0};
let answers = [];

function show(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  window.scrollTo(0,0);
}
function goIntro(){ show('intro'); }

function startQuiz(){
  idx=0; scores={A:0,B:0,C:0,D:0,E:0,F:0}; answers=[];
  show('quiz'); renderQuestion();
}

function renderQuestion(){
  const q = Q[idx];
  document.getElementById('qNum').textContent = "Q"+(idx+1);
  document.getElementById('qText').textContent = q.t;
  document.getElementById('barCount').textContent = (idx)+" / 20";
  document.getElementById('barFill').style.width = (idx/20*100)+"%";
  document.getElementById('barLabel').textContent =
    idx<7?"워밍업 🔥": idx<14?"집중! 💪": "거의 다 왔어요 🎉";
  document.getElementById('backBtn').style.display = idx>0?"block":"none";
  const wrap = document.getElementById('opts');
  wrap.innerHTML='';
  const opts = q.o.slice();
  for(let i=opts.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[opts[i],opts[j]]=[opts[j],opts[i]];}
  opts.forEach(([text,type])=>{
    const b=document.createElement('button');
    b.className='opt';
    b.innerHTML=`<span class="dot"></span><span>${text}</span>`;
    b.onclick=()=>pick(type);
    wrap.appendChild(b);
  });
}

function pick(type){
  scores[type]++; answers[idx]=type; idx++;
  if(idx>=Q.length){ document.getElementById('barFill').style.width="100%"; finish(); }
  else renderQuestion();
}
function prevQuestion(){
  if(idx===0) return;
  idx--; const prev=answers[idx];
  if(prev) scores[prev]--;
  renderQuestion();
}

function topType(){
  // 동점이면 응답에서 먼저 등장한 유형 우선
  let max=Math.max(...Object.values(scores));
  let winners=Object.keys(scores).filter(k=>scores[k]===max);
  if(winners.length===1) return winners[0];
  for(const a of answers){ if(winners.includes(a)) return a; }
  return winners[0];
}

function buildCardHTML(key){

function showResult(key){
  const t=TYPES[key];
  const card=document.getElementById('tcard');
  card.style.background=t.grad;
  card.innerHTML=buildCardHTML(key);
  document.getElementById('matchLine').innerHTML =
    `나와 환상의 짝꿍은 <b>${t.match}</b> 유형! 친구들과 비교해보세요 🐾`;
  buildQR(key);
  show('result');
}
function finish(){ showResult(topType()); }

/* ============================================================
   QR 코드 (스캔하면 내 폰에서 카드 바로 보기 → 저장)
   ============================================================ */
function buildQR(key){
  const box=document.getElementById('qrcode');
  box.innerHTML='';
  let base = location.origin && location.origin!=='null'
    ? location.origin+location.pathname : location.href.split('?')[0];
  const url = base + "?card=" + key;
  new QRCode(box,{ text:url, width:150, height:150,
    colorDark:"#3A2E26", colorLight:"#ffffff", correctLevel:QRCode.CorrectLevel.M });
}

const ua = navigator.userAgent || '';
const isIOS = /iPad|iPhone|iPod/.test(ua) || (navigator.platform==='MacIntel' && navigator.maxTouchPoints>1);
const isAndroid = /Android/.test(ua);
const isMobile = isIOS || isAndroid;

/* ============================================================
   카드 이미지 저장 (html2canvas)
   ============================================================ */
async function saveCard(){
  const node = document.getElementById('cardCapture');
  const btn = document.querySelector('#result .btn.display');
  if(btn){ btn.textContent='⏳ 생성 중...'; btn.disabled=true; }
  try{
    if(document.fonts && document.fonts.ready) await document.fonts.ready;
    // 잠깐 대기 (폰트 렌더 안정화)
    await new Promise(r=>setTimeout(r,300));
    const canvas = await html2canvas(node,{
      scale: 2.5,
      backgroundColor: '#FFF6E9',
      useCORS: true,
      logging: false,
      allowTaint: true
    });
    const data = canvas.toDataURL('image/png');

    // 모달에 이미지 세팅
    const imgEl = document.getElementById('savedImg');
    const dlEl  = document.getElementById('dlLink');
    imgEl.src = data;
    dlEl.href = data;
    dlEl.download = '나의-재무유형-' + Date.now() + '.png';

    // 기기별 안내 문구
    const guide = document.getElementById('saveGuide');
    if(isIOS){
      guide.innerHTML = '📱 <b>iPhone / iPad 저장 방법</b><br>① 아래 이미지를 <b>길게 꾹 누르세요</b><br>② 메뉴에서 <b>"사진에 저장"</b>을 탭하세요';
      dlEl.style.display = 'none'; // iOS Safari는 download 속성 동작 불안정
    } else if(isAndroid){
      guide.innerHTML = '📱 <b>Android 저장 방법</b><br>① 아래 <b>"이미지 다운로드"</b> 버튼을 누르거나<br>② 이미지를 <b>길게 눌러</b> 저장하세요';
      dlEl.style.display = 'block';
    } else {
      guide.innerHTML = '💻 아래 버튼을 눌러 이미지를 저장하세요.';
      dlEl.style.display = 'block';
      // 데스크톱은 자동 다운로드
      const a = document.createElement('a');
      a.href = data;
      a.download = '나의-재무유형-' + Date.now() + '.png';
      document.body.appendChild(a); a.click(); a.remove();
    }

    document.getElementById('saveModal').classList.add('show');
  } catch(err){
    console.error(err);
    alert('이미지 생성 중 문제가 발생했어요.\n스크린샷으로 저장해 주세요! 📸');
  } finally {
    if(btn){ btn.textContent='📸 유형 카드 이미지로 저장'; btn.disabled=false; }
  }
}
function closeModal(){ document.getElementById('saveModal').classList.remove('show'); }

/* ============================================================
   전체 유형 도감
   ============================================================ */
function showAllTypes(){
  const grid=document.getElementById('typeGrid');
  grid.innerHTML='';
  Object.keys(TYPES).forEach(k=>{
    const t=TYPES[k];
    const el=document.createElement('div');
    el.style.cssText=`background:${t.grad};border-radius:20px;padding:16px 18px;margin-bottom:11px;
      display:flex;align-items:center;gap:14px;box-shadow:var(--card-shadow);border:3px solid rgba(255,255,255,.85)`;
    el.innerHTML=`<div style="font-size:42px;flex:0 0 auto">${t.face}</div>
      <div style="text-align:left">
        <div class="display" style="font-size:19px;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.2)">${t.name}</div>
        <div style="display:inline-block;background:rgba(255,255,255,.92);font-weight:700;font-size:11px;padding:3px 9px;border-radius:99px;margin:3px 0;color:${t.badge}">${t.sub}</div>
        <div style="font-size:12.5px;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.18)">“${t.slogan}”</div>
      </div>`;
    grid.appendChild(el);
  });
  show('allTypes');
}

function restart(){ startQuiz(); }

/* ============================================================
   QR로 들어온 경우(?card=X) → 카드 바로 보여주기
   ============================================================ */
(function init(){
  const params=new URLSearchParams(location.search);
  const c=params.get('card');
  if(c && TYPES[c.toUpperCase()]){
    showResult(c.toUpperCase());
  }
})();
</script>
